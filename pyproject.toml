[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    "mlruns",
    ".git",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"